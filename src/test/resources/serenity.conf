webdriver {
  driver = chrome
  autodownload = false
}

headless.mode = false

chrome {
  switches = [
    "--start-maximized",
    "--ignore-certificate-errors",
    "--disabled-web-security",
    "--allow-running-insecure-content",
    "--remote-allow-origins=*"
  ]
  mobileEmulation {
    deviceName = "Pixel 5"
  }
}

serenity {
  take.screenshots = FOR_EACH_ACTION
  console.colors = true
}
