plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '3.9.8'
}

defaultTasks 'clean', 'test', 'aggregate'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

ext {
    serenityVersion = '3.9.8'
    junitVersion = '4.13.2'
}

dependencies {
    testImplementation "net.serenity-bdd:serenity-core:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-junit:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-screenplay-webdriver:${serenityVersion}"
    testImplementation "net.serenity-bdd:serenity-cucumber:${serenityVersion}"
    testImplementation 'org.seleniumhq.selenium:selenium-java:4.51.0'
    testImplementation "junit:junit:${junitVersion}"
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'
}

test {
    testLogging {
        events 'started', 'passed', 'failed'
        exceptionFormat 'short'
        showStandardStreams = false
    }
    afterSuite { descriptor, result ->
        if (!descriptor.parent) {
            def status = result.testCount == 0
                    ? 'NO SE EJECUTARON PRUEBAS'
                    : result.failedTestCount == 0 ? 'PRUEBAS OK' : 'PRUEBAS FALLARON'
            println("PRINT: ${status} (${result.testCount} pruebas, ${result.failedTestCount} fallidas)")
        }
    }
    systemProperties System.getProperties()
}

serenity {
    reports = ["single-page-html"]
}